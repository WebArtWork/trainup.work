<section class="mx-auto flex max-w-md flex-col items-center py-8 text-center">
	<img class="h-16 w-16" src="logo.png" alt="" width="64" height="64" />
	<h1
		class="mt-5 text-3xl font-semibold tracking-[-0.03em] text-[var(--c-text-strong)]"
		translate
	>
		Вхід у TrainUp
	</h1>
	<p class="mt-3 text-base leading-7 text-[var(--c-text)]" translate>
		Збережемо вашу ціль, обладнання та простір, щоб план був доступний на будь-якому пристрої.
	</p>

	<div class="mt-8 flex w-full flex-col gap-3">
		@for (button of providers; track button.provider) {
			<button
				class="theme-focus theme-interactive inline-flex min-h-14 w-full items-center justify-center gap-3 rounded-[var(--radius-btn)] border-2 px-5 text-base font-semibold disabled:opacity-60"
				[class]="
					button.provider === 'apple'
						? 'border-[var(--c-text-strong)] bg-[var(--c-text-strong)] text-[var(--c-bg-secondary)]'
						: 'border-[var(--c-border)] bg-[var(--c-bg-secondary)] text-[var(--c-text-strong)] hover:border-[var(--c-text-muted)]'
				"
				type="button"
				[disabled]="pending() !== null"
				[attr.aria-busy]="pending() === button.provider"
				(click)="signIn(button.provider)"
			>
				@if (pending() === button.provider) {
					<span
						class="material-symbols-outlined animate-spin text-[22px]"
						aria-hidden="true"
					>
						progress_activity
					</span>
				} @else {
					@switch (button.provider) {
						@case ('google') {
							<svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
								<path
									fill="#FFC107"
									d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"
								/>
								<path
									fill="#FF3D00"
									d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"
								/>
								<path
									fill="#4CAF50"
									d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"
								/>
								<path
									fill="#1976D2"
									d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"
								/>
							</svg>
						}
						@case ('apple') {
							<svg
								class="h-5 w-5"
								viewBox="0 0 24 24"
								fill="currentColor"
								aria-hidden="true"
							>
								<path
									d="M16.37 12.76c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.82-.81-2.99-.79-1.54.02-2.96.9-3.75 2.27-1.6 2.78-.41 6.89 1.15 9.14.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.02-1.12 2.77-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.39-.92-2.4-3.66zM14.1 6.01c.63-.77 1.06-1.83.94-2.89-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.28z"
								/>
							</svg>
						}
					}
				}
				<span [translate]="button.label">{{ button.label }}</span>
			</button>
		}
	</div>

	@if (error(); as message) {
		<p
			class="mt-5 w-full rounded-[var(--radius-card)] border border-[var(--c-error)] p-4 text-sm leading-6 text-[var(--c-error)]"
			role="alert"
			[translate]="message"
		>
			{{ message }}
		</p>
	}

	<p class="mt-8 text-sm leading-6 text-[var(--c-text-muted)]" translate>
		TrainUp не ставить діагнозів і не замінює консультацію лікаря.
	</p>
</section>
