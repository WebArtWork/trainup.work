<header
	class="relative z-50 border-b-2 border-[var(--c-border)] bg-[var(--c-bg-primary)]/90 backdrop-blur supports-[backdrop-filter]:bg-[var(--c-bg-primary)]/75 dark:border-b dark:border-[var(--c-border)] dark:bg-[var(--c-bg-primary)]/70"
>
	<div class="page-wrap flex min-h-[4.5rem] items-center justify-between gap-3 py-3">
		<a
			[translate]="{ ariaLabel: 'Перейти на головну сторінку' }"
			class="theme-focus inline-flex items-center gap-3 rounded-[var(--radius-btn)]"
			routerLink="/"
		>
			<img
				class="h-10 w-10 rounded-[calc(var(--radius-card)*0.5)]"
				[translate]="{ alt: 'Логотип проєкту' }"
				ngSrc="logo.png"
				width="40"
				height="40"
				priority
			/>
			@if (company().name && !title()) {
				<span class="font-display text-lg text-[var(--c-text-strong)] max-sm:hidden">
					{{ company().name }}
				</span>
			}
		</a>

		@if (title(); as pageTitle) {
			@if (titleHeading()) {
				<h1
					class="font-display min-w-0 flex-1 truncate text-xl text-[var(--c-text-strong)]"
					[translate]="pageTitle"
				></h1>
			} @else {
				<p
					class="font-display min-w-0 flex-1 truncate text-xl text-[var(--c-text-strong)]"
					[translate]="pageTitle"
				></p>
			}
		}

		<div class="flex items-center gap-2 sm:gap-3">
			@if (cta()) {
				<a class="btn btn-primary btn-sm max-sm:hidden" routerLink="/app">
					<span translate>Відкрити застосунок</span>
				</a>
			}

			@if (profile(); as account) {
				<a
					class="icon-btn overflow-hidden"
					routerLink="/app/profile"
					routerLinkActive="ring-2 ring-[var(--c-primary)]"
					[translate]="{ ariaLabel: 'Профіль' }"
				>
					@if (account.photoUrl) {
						<img
							class="h-full w-full object-cover"
							[src]="account.photoUrl"
							alt=""
							width="40"
							height="40"
							referrerpolicy="no-referrer"
						/>
					} @else {
						<span class="material-symbols-outlined text-[22px]" aria-hidden="true">person</span>
					}
				</a>
			}

			@if (controls()) {
				<app-preferences-controls />
			}
		</div>
	</div>
</header>
