<footer
	class="mt-16 rounded-t-[calc(var(--radius-card)*1.5)] bg-[var(--c-text-strong)] text-[var(--c-bg-primary)] dark:mt-20 dark:rounded-none dark:border-t dark:border-[var(--c-border)] dark:bg-[var(--c-bg-secondary)] dark:text-[var(--c-text)]"
>
	<div class="page-wrap grid gap-10 py-12 lg:grid-cols-[minmax(0,1.4fr)_minmax(14rem,0.8fr)] lg:gap-16">
		<div class="flex items-start gap-4">
			<img
				class="h-14 w-14 shrink-0 rounded-[calc(var(--radius-card)*0.6)] bg-[var(--c-bg-primary)] object-cover p-1.5 dark:bg-[var(--c-bg-tertiary)]"
				[src]="companyImage()"
				[translate]="{ alt: companyImageAlt() }"
				loading="lazy"
				decoding="async"
			/>

			<div>
				@if (company().name) {
					<p class="font-display text-xl text-[var(--c-bg-primary)] dark:text-[var(--c-text-strong)]">
						{{ company().name }}
					</p>
				}
				<p class="mt-2 max-w-xl text-sm leading-7 opacity-80">
					{{ companyDescription() }}
				</p>
			</div>
		</div>

		<nav [translate]="{ ariaLabel: 'Навігація сторінками у футері' }">
			<ul class="flex flex-col gap-1">
				@for (page of pageLinks(); track page.path) {
					<li>
						<a
							class="theme-focus inline-flex min-h-11 items-center rounded-md text-base font-semibold text-[var(--c-bg-primary)] underline decoration-transparent decoration-2 underline-offset-4 transition-colors hover:decoration-[var(--c-sun)] dark:text-[var(--c-text-strong)] dark:hover:decoration-[var(--c-primary-text)]"
							[routerLink]="page.path"
							[translate]="page.label"
						>
							{{ page.label }}
						</a>
					</li>
				}
			</ul>
		</nav>
	</div>

	<div class="border-t border-white/15 dark:border-[var(--c-border)]">
		<p class="page-wrap py-5 text-sm opacity-75">
			&copy; {{ currentYear }} {{ company().name || company().title }}.
			<span translate>Усі права захищено.</span>
		</p>
	</div>
</footer>
