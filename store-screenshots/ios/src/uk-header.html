<!doctype html><html lang="uk"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 823px; overflow: hidden; }
body {
	font-family: 'Onest', system-ui, sans-serif; color: #2a160c; position: relative;
	background:
		radial-gradient(45% 80% at 78% 10%, rgba(255, 201, 60, .85), transparent 70%),
		radial-gradient(35% 60% at 10% 100%, rgba(214, 65, 15, .14), transparent 70%),
		#fff1de;
}
.text { position: absolute; left: 300px; top: 50%; transform: translateY(-50%); width: 640px; }
.brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.brand img { width: 60px; height: 60px; border-radius: 16px; }
h1 { margin-top: 26px; font-size: 68px; line-height: 1.04; font-weight: 900; letter-spacing: -.035em; }
h1 em { font-style: normal; color: #d6410f; }
p { margin-top: 22px; font-size: 24px; line-height: 1.45; color: #4d3a2c; max-width: 560px; }
.tags { display: flex; gap: 10px; margin-top: 28px; }
.tag { font-size: 18px; font-weight: 700; padding: 10px 18px; border-radius: 999px; background: #fff; border: 2px solid #2a160c; box-shadow: 0 3px 0 #2a160c; }
.tag.sun { background: #ffc93c; }

/* phone crops taken from the rendered 1206×2622 screenshots (phone spans y≈204..860 of 874 css px) */
.phone { position: absolute; width: 311px; height: 655px; border-radius: 45px; overflow: hidden;
	background-size: 402px auto; background-position: -45.5px -204px; box-shadow: 0 30px 60px -20px rgba(138, 54, 15, .45); }
.p1 { left: 1040px; top: 120px; transform: rotate(-6deg); background-image: url('../iphone-uk-1206x2622/3-setup.png'); }
.p2 { left: 1285px; top: 84px; z-index: 2; background-image: url('../iphone-uk-1206x2622/1-today.png'); }
.p3 { left: 1530px; top: 120px; transform: rotate(6deg); background-image: url('../iphone-uk-1206x2622/2-workout.png'); }
</style></head><body>
<div class="text">
	<div class="brand"><img src="../../../src/assets/logo.png" alt="">TrainUp</div>
	<h1>План тренувань <em>під ваш простір</em></h1>
	<p>Вкажіть ціль, обладнання й вільне місце — TrainUp складе реалістичну програму за хвилину.</p>
	<div class="tags"><span class="tag sun">Без реклами</span><span class="tag">Без чатів зі ШІ</span><span class="tag">Українською</span></div>
</div>
<div class="phone p1"></div>
<div class="phone p2"></div>
<div class="phone p3"></div>
</body></html>
